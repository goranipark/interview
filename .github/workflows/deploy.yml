# main 브랜치에 푸시하면 자동으로 빌드해서 GitHub Pages에 올립니다.
# (dist 폴더를 저장소에 커밋하지 않아도 됩니다)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 저장소 Actions 탭에서 수동으로 실행할 수도 있게 함
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 최신 것만 진행
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v7

      - name: Node.js 준비
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 패키지 설치
        run: npm ci

      # 면담 데이터를 잘못 고치면(추천 질문이 매칭 안 되거나 퀴즈 해설이
      # 없는 답변을 가리키면) 여기서 걸러지고 배포가 중단됩니다.
      - name: 데이터·지도 검사
        run: npm test

      - name: 빌드 (단일 HTML 파일 생성)
        run: npm run build

      - name: Pages 설정
        uses: actions/configure-pages@v6
        with:
          # 저장소 설정에서 Pages를 아직 안 켰더라도 이 워크플로가 직접 켭니다.
          # (이 옵션이 없으면 "Get Pages site failed ... Not Found" 오류가 납니다)
          enablement: true

      - name: 빌드 결과 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v5
